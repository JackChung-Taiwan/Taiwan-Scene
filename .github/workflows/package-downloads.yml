name: Package classroom downloads
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build teaching ZIP files
        run: python scripts/package_downloads.py
      - name: Commit downloadable ZIP archives
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/Taiwan_Scenic_100_Images.zip downloads/Taiwan_Scenic_100_GitHub_Project.zip
          if git diff --cached --quiet; then
            echo "Download ZIP files already current"
          else
            git commit -m "Build downloadable scenic images and website ZIP [skip ci]"
            git push
          fi
